<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匣中签 · 物有灵犀 — Demo v3 — 楊雪琪</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/things-section.css">
  <style>
    :root {
      --bg: #F2EDF8; --text: #2D2536; --soft: #8A92B0; --accent: #D88CA8;
      --g1: #E2DDF2; --g2: #F5DDEB; --branch: #6a5f7a;
      --serif: 'Noto Serif SC', serif;
      --english: 'Cormorant Garamond', Georgia, serif;
      --cn-light: 'LXGW WenKai', 'Noto Serif SC', serif;
      --cn-title: 'Noto Serif SC', serif;
      --cn-poem: 'LXGW WenKai', serif;
      --cn-art: 'ZCOOL XiaoWei', serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--serif);
      color: var(--text);
      min-height: 100vh;
      background: radial-gradient(circle at 12% 18%, var(--g1) 0%, transparent 55%),
        radial-gradient(circle at 82% 28%, var(--g2) 0%, transparent 50%), var(--bg);
    }
    .demo-banner {
      text-align: center;
      padding: 1rem;
      font-family: var(--cn-light);
      font-size: 0.82rem;
      color: var(--soft);
      background: rgba(255,255,255,0.35);
      border-bottom: 1px dashed color-mix(in srgb, var(--accent) 25%, transparent);
    }
    .demo-banner a { color: var(--accent); }
    .content-wrapper { max-width: 920px; margin: 0 auto; padding: 3.5rem 2rem 5rem; }
    .align-right { text-align: right; }
  </style>
</head>
<body class="spring">
  <div class="demo-banner">
    Demo v3 · 匣中签 · 未接入主站 ·
    <a href="index%20(1).html">返回主页</a> ·
    <a href="assets/things/DESIGN.md">素材指南</a>
  </div>

  <div class="content-wrapper">
    <section class="open-section align-right visible things-v3" id="things-demo">
      <h2 class="things-dual-title">
        匣中签
        <span class="t-sub">物有灵犀</span>
      </h2>

      <div class="things-welcome">
        <span class="verse">
          岁月是一首未尽的诗。若你也偏爱袖珍的光影与墨迹，欢迎在此驻足。<br>
          它们不急着被看完，像窗台上晾着的字，等风，也等一个愿意停下来的你。
        </span>
        <span class="origin-block">
          <span class="origin-title">欢迎来到我的原创世界</span>
          此处每一缕墨色、每一道纸痕，皆出自我手；愿你在翻阅之间，与我隔空相遇，默然相知。
        </span>
        <span class="en">Every stroke and fold here is mine —<br>may we meet across the quiet of this page.</span>
      </div>

      <div class="draw-zone">
        <div class="lot-vessel" role="button" tabindex="0" aria-label="签筒">
          <div class="vessel-sticks">
            <i></i><i></i><i></i><i></i>
          </div>
          <div class="vessel-rim"></div>
          <div class="vessel-body"></div>
        </div>

        <div class="draw-panel">
          <p class="draw-hint">
            签筒里收着偶然相遇的小物<br>
            不贵重，只是恰好想与你分享
          </p>
          <button type="button" class="draw-btn">摇一枝签</button>
        </div>

        <div class="envelope-stage" aria-hidden="true">
          <div>
            <div class="envelope-wrap">
              <div class="envelope-back"></div>
              <div class="letter-sheet">
                <p class="letter-sign-label"></p>
                <p class="letter-verse"></p>
                <p class="letter-item-name"></p>
                <p class="letter-note"></p>
                <div class="letter-thumb"></div>
              </div>
              <div class="envelope-front"></div>
              <div class="envelope-flap"></div>
            </div>
            <div class="letter-actions">
              <button type="button" data-action="again">再摇一枝</button>
              <button type="button" data-action="find">在展匣中寻它</button>
            </div>
          </div>
        </div>
      </div>

      <div class="gallery-gate">
        <button type="button" class="gallery-toggle-btn">展开展匣，慢慢翻阅</button>
      </div>

      <div class="wish-tree-wrap">
        <p class="wish-tree-label">展匣</p>
        <div class="wish-tree">
          <svg class="tree-svg" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <path d="M340 500 C330 420, 318 360, 300 300 C285 250, 270 200, 255 155 C240 110, 228 75, 218 48"/>
            <path d="M300 300 C260 285, 220 270, 175 258 C130 246, 90 238, 55 232"/>
            <path d="M300 300 C285 265, 268 232, 248 200 C228 168, 205 140, 178 115"/>
            <path d="M255 155 C235 140, 212 128, 185 118 C158 108, 128 100, 95 94"/>
            <path d="M255 155 C268 125, 278 98, 285 72 C292 46, 296 28, 298 12"/>
            <path d="M218 48 C200 38, 178 30, 152 24 C126 18, 98 14, 68 12"/>
            <path d="M300 300 C320 275, 338 248, 352 218 C366 188, 376 155, 382 120"/>
            <path d="M352 218 C368 210, 382 198, 392 182"/>
            <path d="M248 200 C230 185, 208 172, 182 162"/>
            <path d="M178 115 C165 95, 148 78, 125 64"/>
            <path d="M285 72 C300 68, 315 62, 328 52"/>
            <path d="M340 500 C355 480, 368 455, 378 425 C388 395, 394 360, 396 325"/>
            <path d="M318 360 C335 345, 348 325, 356 300"/>
          </svg>
          <div class="tree-tags"></div>
        </div>
      </div>

      <div class="thing-modal"></div>
    </section>
  </div>

  <script src="assets/things-section.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => initThingsSection('things-demo'));
  </script>
</body>
</html>
