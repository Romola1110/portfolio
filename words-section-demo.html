<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@300;400;600&family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=LXGW+WenKai:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2EDF8;--text:#2D2536;--soft:#8A92B0;--accent:#D88CA8;
  --g1:#E2DDF2;--g2:#F5DDEB;--serif:'Noto Serif SC',serif;
  --english:'Cormorant Garamond',Georgia,serif;
  --cn-art:'Zhi Mang Xing',cursive;--cn-light:'LXGW WenKai','Noto Serif SC',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--serif);color:var(--text);line-height:1.85;
  background:radial-gradient(circle at 10% 20%,var(--g1),transparent 55%),
  radial-gradient(circle at 85% 30%,var(--g2),transparent 50%),var(--bg);
  min-height:100vh;
}
.demo-banner{
  text-align:center;padding:2rem 1.5rem 1rem;
  border-bottom:1px solid rgba(120,100,140,.12);
  background:rgba(255,255,255,.35);backdrop-filter:blur(8px);
}
.demo-banner p{font-size:.82rem;color:var(--soft);margin-top:.35rem}
.nav-mini{display:flex;justify-content:center;gap:1.2rem;flex-wrap:wrap;margin-top:1rem}
.nav-mini a{font-size:.78rem;color:var(--soft);text-decoration:none;letter-spacing:.08em}
.nav-mini a:hover{color:var(--accent)}

.content-wrapper{padding:3rem 0 5rem;max-width:1100px;margin:0 auto}
.open-section{padding:0 2rem;margin-bottom:3rem}
.section-title{font-family:var(--cn-art);font-size:3rem;font-weight:400;letter-spacing:.1em}
.section-en{font-family:var(--english);font-style:italic;color:var(--soft);margin:.3rem 0 2rem;font-weight:600}
.section-desc{
  font-family:var(--cn-light);font-size:.95rem;color:var(--text);
  background:rgba(255,255,255,.35);padding:1rem 1.2rem;border-radius:8px;
  margin-bottom:2.5rem;max-width:720px;
}

/* ===== 分区 ===== */
.words-zone{margin-bottom:3.5rem}
.words-zone-label{
  font-size:.78rem;letter-spacing:.18em;color:var(--soft);
  margin:0 0 1.5rem;padding-left:.5rem;
  border-left:3px solid var(--accent);font-weight:600;
}
.words-zone--brand .words-zone-label{border-left-color:#C06B8A}
.words-zone--culture .words-zone-label{border-left-color:#8A9BB8}
.words-zone--literature .words-zone-label{border-left-color:#9A9088}

.words-grid{display:flex;flex-direction:column;gap:3.5rem;position:relative;z-index:5}
.words-grid--compact{gap:2.5rem}
.words-grid--compact .word-card{width:82%;padding:3.2rem 3rem 2.6rem}

/* ===== word-card（沿用主站逻辑）===== */
.word-card{
  position:relative;background:rgba(255,255,255,.55);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.8);border-radius:8px;
  padding:4.2rem 3.8rem 3.2rem;width:88%;
  box-shadow:0 10px 40px rgba(0,0,0,.03),inset 0 0 15px rgba(255,255,255,.6);
  cursor:pointer;overflow:visible;transition:all .5s cubic-bezier(.2,.8,.2,1);
}
.word-card.align-left{align-self:flex-start;text-align:left;border-left:3px solid rgba(160,155,165,.4)}
.word-card.align-right{align-self:flex-end;text-align:right;border-right:3px solid rgba(160,155,165,.4)}
.word-card:hover{background:rgba(255,255,255,.88);transform:translateY(-5px);
  box-shadow:0 20px 50px rgba(0,0,0,.08)}
.word-card.align-left:hover{border-left-color:var(--accent)}
.word-card.align-right:hover{border-right-color:var(--accent)}

.binder-holes{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:18px}
.word-card.align-left .binder-holes{left:-14px}
.word-card.align-right .binder-holes{right:-14px}
.hole{width:10px;height:10px;border-radius:50%;background:rgba(200,190,180,.5);border:1px solid rgba(255,255,255,.8)}

.card-ribbon{
  position:absolute;top:-12px;display:inline-flex;align-items:center;gap:.4rem;
  background:var(--g2);padding:.35rem .85rem;border-radius:4px;
  font-size:.78rem;color:var(--text);font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.06);
}
.word-card.align-left .card-ribbon{left:2rem}
.word-card.align-right .card-ribbon{right:2rem}
.card-title{font-family:var(--serif);font-size:1.55rem;font-weight:700;margin:1rem 0 .8rem;line-height:1.5}
.card-quote-box{position:relative;margin:1rem 0 1.2rem}
.quote-mark{font-family:var(--english);font-size:2.5rem;color:var(--accent);opacity:.5;line-height:1}
.card-quote{font-family:var(--cn-light);font-size:1.05rem;color:var(--text);font-weight:500;line-height:1.8}
.card-tag{font-family:var(--english);font-size:.85rem;font-weight:600;color:var(--accent);letter-spacing:.12em;text-transform:uppercase}

.hover-panel{position:absolute;top:0;bottom:0;width:70%;display:flex;align-items:center;
  padding:2rem 3rem;pointer-events:none;z-index:15;overflow:hidden}
.hover-panel::before{content:'';position:absolute;inset:0;z-index:-1;background:var(--g2);opacity:.88;backdrop-filter:blur(15px)}
.word-card.align-right .hover-panel{left:0;transform:translateX(-101%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.word-card.align-right:hover .hover-panel{transform:translateX(0)}
.word-card.align-left .hover-panel.left-panel{right:0;transform:translateX(101%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.word-card.align-left:hover .hover-panel.left-panel{transform:translateX(0)}
.hover-content{opacity:0;transition:opacity .4s .2s;text-align:left;max-width:95%}
.word-card:hover .hover-content{opacity:1}
.hover-text{font-size:1rem;line-height:1.85;margin-bottom:.8rem;font-weight:600}
.hover-hint{font-family:var(--english);font-style:italic;font-size:.9rem;color:var(--soft)}

/* ===== Book Modal ===== */
.book-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;z-index:1000;
  opacity:0;visibility:hidden;transition:all .45s ease}
.book-overlay.active{opacity:1;visibility:visible}
.book-container{
  display:flex;width:92vw;max-width:1200px;height:86vh;
  background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-radius:12px;
  box-shadow:0 30px 80px rgba(0,0,0,.2);position:relative;
  transform:scale(.96) translateY(16px);transition:all .45s cubic-bezier(.2,.8,.2,1);
}
.book-overlay.active .book-container{transform:scale(1) translateY(0)}
.book-spine{position:absolute;top:0;bottom:0;left:50%;width:36px;margin-left:-18px;
  background:linear-gradient(to right,transparent,rgba(0,0,0,.04),rgba(255,255,255,.4),transparent);pointer-events:none;z-index:10}
.book-page{flex:1;padding:3rem 3.5rem;overflow-y:auto;text-align:left}
.book-page.left{border-right:1px solid rgba(0,0,0,.06)}
.close-btn{position:absolute;top:1rem;right:1rem;width:40px;height:40px;border-radius:50%;
  border:none;background:#fff;cursor:pointer;font-size:1.2rem;box-shadow:0 4px 12px rgba(0,0,0,.08);z-index:20}
.b-full-title{font-size:1.35rem;font-weight:700;margin-bottom:1rem;line-height:1.5}
.b-intro-title{font-size:.85rem;color:var(--soft);letter-spacing:.1em;margin:1.2rem 0 .6rem}
.b-text{font-family:var(--cn-light);font-size:.95rem;line-height:1.9}
.pdf-btn,.ext-btn{
  display:inline-block;margin-top:1.2rem;padding:.55rem 1.1rem;border-radius:999px;
  background:var(--g2);color:var(--text);text-decoration:none;font-size:.85rem;border:1px solid rgba(0,0,0,.06)
}
.pdf-btn:hover,.ext-btn:hover{background:var(--accent);color:#fff}

/* anthology nav */
.anthology-nav{display:flex;flex-direction:column;gap:.35rem;margin-top:1rem}
.anthology-nav button{
  text-align:left;border:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.6);
  padding:.65rem .85rem;border-radius:8px;cursor:pointer;font-family:var(--cn-light);font-size:.88rem;
  transition:.2s;color:var(--text);

.anthology-nav button.active,.anthology-nav button:hover{border-color:var(--accent);background:var(--g2)}
.pitch-list{list-style:none;margin-top:.5rem}
.pitch-list li{padding:.55rem 0;border-bottom:1px solid rgba(0,0,0,.05);font-size:.9rem;cursor:pointer}
.pitch-list li:hover{color:var(--accent)}
.pitch-list li.active{font-weight:700;color:var(--accent)}
.essay-body p{margin-bottom:1rem;text-indent:2em}
.essay-body .scene-break{text-align:center;color:var(--soft);margin:1.5rem 0;letter-spacing:.3em}
.fig-placeholder{
  height:140px;background:linear-gradient(135deg,var(--g1),var(--g2));
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:.78rem;color:var(--soft);margin:1rem 0;border:1px dashed rgba(0,0,0,.08)

.mode-tag{position:absolute;top:1rem;left:1.5rem;font-size:.68rem;color:var(--soft);letter-spacing:.1em}
</style>
</head>

function feather(){return `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" opacity=".6"><path d="M20.24,3.76C19,2.5 16.5,2 13.5,3c-3.13,1.04-6.44,3.8-8.8,7.11"/></svg>`}

function renderCard(data, container){
  const panelClass = data.align === 'left' ? 'left-panel' : '';
  const html = `
    <div class="word-card align-${data.align}" onclick="openWork('${data.id}')">
      <div class="binder-holes"><div class="hole"></div><div class="hole"></div><div class="hole"></div></div>
      <div class="card-ribbon">${feather()}<span>${data.cnTag}</span></div>
      <h3 class="card-title">${data.listTitle}</h3>
      <div class="card-quote-box"><span class="quote-mark">“</span><p class="card-quote">${data.listQuote}</p></div>
      <div class="card-tag">${data.tag}</div>
      <div class="hover-panel ${panelClass}">
        <div class="hover-content">
          ${data.hover.map(h=>`<p class="hover-text">${h}</p>`).join('')}
          <div class="hover-hint">Read More →</div>
        </div>
      </div>
    </div>`;
  container.insertAdjacentHTML('beforeend', html);
}

function allWorks(){
  return [...works.brand,...works.culture,...works.literature];
}

function openWork(id){
  const data = allWorks().find(w=>w.id===id);
  if(!data) return;
  const left = document.getElementById('bookLeft');
  const right = document.getElementById('bookRight');
  document.getElementById('modalMode').textContent = 'MODE · ' + data.mode.toUpperCase();

  if(data.mode === 'proposal'){
    left.innerHTML = `<h3 class="b-full-title">${data.listTitle}</h3><div class="b-intro-title">方案摘要</div><div class="b-text">${data.intro}</div>`;
    right.innerHTML = `<div class="fig-placeholder" style="height:220px">KV / 策划案预览区</div>
      <a class="pdf-btn" href="${data.pdf}" target="_blank">查看完整 PDF</a>`;
  } else if(data.mode === 'anthology'){
    left.innerHTML = `<h3 class="b-full-title">${data.listTitle}</h3>
      <div class="b-intro-title">目录 · 4 篇</div>
      <div class="anthology-nav" id="anthNav"></div>`;
    right.innerHTML = `<div class="b-text essay-body" id="anthBody"></div>`;
    const nav = document.getElementById('anthNav');
    data.articles.forEach((a,i)=>{
      const btn = document.createElement('button');
      btn.textContent = (i+1)+'. '+a.title;
      btn.onclick = ()=>showArticle(data, i, btn);
      nav.appendChild(btn);
    });
    showArticle(data, 0, nav.querySelector('button'));
  } else if(data.mode === 'essay'){
    left.innerHTML = `<h3 class="b-full-title">${data.listTitle}</h3><div class="b-intro-title">纪行 · 节选</div>`;
    right.innerHTML = `<div class="b-text essay-body">${data.sections.map(s=>
      `<p>${s.text}</p>${s.fig?`<div class="fig-placeholder">${s.fig}</div>`:''}`
    ).join('<div class="scene-break">——</div>')}</div>`;
  } else if(data.mode === 'pitch'){
    left.innerHTML = `<h3 class="b-full-title">${data.listTitle}</h3>
      <div class="b-intro-title">三个选题 · 点击切换</div>
      <ul class="pitch-list" id="pitchList"></ul>
      <a class="pdf-btn" href="${data.pdf}" download>下载完整提案 Word</a>`;
    right.innerHTML = `<div class="b-text" id="pitchBody"></div>`;
    const list = document.getElementById('pitchList');
    data.topics.forEach((t,i)=>{
      const li = document.createElement('li');
      li.textContent = t.title;
      li.onclick = ()=>showPitch(data, i, li);
      list.appendChild(li);
    });
    showPitch(data, 0, list.querySelector('li'));
  } else if(data.mode === 'link'){
    left.innerHTML = `<h3 class="b-full-title">${data.listTitle}</h3><div class="b-text">${data.intro}</div>`;
    right.innerHTML = `<div class="fig-placeholder" style="height:180px">小红书截图 1</div>
      <div class="fig-placeholder" style="height:180px">小红书截图 2</div>
      <a class="ext-btn" href="${data.url}" target="_blank" rel="noopener">在小红书查看原文</a>`;
  } else {
    left.innerHTML = `<h3 class="b-full-title">${data.listTitle}</h3><div class="b-intro-title">导读</div><div class="b-text">${data.intro}</div>`;
    right.innerHTML = `<div class="fig-placeholder" style="height:260px">正式站 · 封面 / PDF / 翻译 stack</div>`;
  }
  document.getElementById('bookModal').classList.add('active');
}

function showArticle(data, idx, btn){
  document.querySelectorAll('#anthNav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('anthBody').innerHTML = `<h4 style="margin-bottom:1rem;font-weight:700">${data.articles[idx].title}</h4>` + data.articles[idx].body;
}
function showPitch(data, idx, li){
  document.querySelectorAll('#pitchList li').forEach(l=>l.classList.remove('active'));
  li.classList.add('active');
  document.getElementById('pitchBody').innerHTML = `<p style="font-weight:700;margin-bottom:1rem">${data.topics[idx].title}</p><p>${data.topics[idx].summary}</p>`;
}
function closeBook(e){
  if(e.target.id==='bookModal'||e.target.classList.contains('close-btn'))
    document.getElementById('bookModal').classList.remove('active');
}

works.brand.forEach(w=>renderCard(w, document.getElementById('gridBrand')));
works.culture.forEach(w=>renderCard(w, document.getElementById('gridCulture')));
works.literature.forEach(w=>renderCard(w, document.getElementById('gridLit')));
</script>
</body>
</html>
