name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'index (1).html'
      - 'assets/**'
      - '!assets/uploads/**-src/**'
      - '*.pdf'
      - 'yuwei.ttf'
      - 'yuweifanti.ttf'
      - '1.jpg'
      - '1.png'
      - '2.png'
      - '3.png'
      - '反诈最强音.png'
      - '.github/workflows/deploy-pages.yml'
      - 'scripts/prepare-pages-bundle.sh'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare lean site bundle
        run: bash scripts/prepare-pages-bundle.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
