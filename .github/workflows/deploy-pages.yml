name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'index (1).html'
      - 'assets/things/**'
      - 'assets/things-section.*'
      - 'assets/photos/**'
      - 'assets/previews/**'
      - 'assets/dh/**'
      - 'assets/visual-section.*'
      - 'assets/photography-*'
      - 'assets/photo/**'
      - 'assets/fonts/**'
      - 'assets/mobile.css'
      - 'assets/cdn-fallback.js'
      - 'assets/vendor/**'
      - '.github/workflows/deploy-pages.yml'
      - 'scripts/prepare-pages-bundle.sh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare lean site bundle
        run: bash scripts/prepare-pages-bundle.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry Pages deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        id: deployment_retry
